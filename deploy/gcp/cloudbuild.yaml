steps:
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-f'
      - 'deploy/gcp/Dockerfile'
      - '-t'
      - '$_LOCATION-docker.pkg.dev/$PROJECT_ID/$_REPO_NAME/uninews-web:$COMMIT_SHA'
      - '-t'
      - '$_LOCATION-docker.pkg.dev/$PROJECT_ID/$_REPO_NAME/uninews-web:latest'
      - '.'

images:
  - '$_LOCATION-docker.pkg.dev/$PROJECT_ID/$_REPO_NAME/uninews-web:$COMMIT_SHA'
  - '$_LOCATION-docker.pkg.dev/$PROJECT_ID/$_REPO_NAME/uninews-web:latest'

substitutions:
  _LOCATION: 'us-central1'
  _REPO_NAME: 'uninews'
